<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>skew e scale</title>
    <style>
        .d1 {
            width: 200px;
            height: 200px;
            background: black;
            transform: skewY(23deg) skewX(23deg);
            transform: scaleY();
        }

        .d2 {
            width: 200px;
            height: 200px;
            background: red;
            transform: scale(2.5, .4);
            margin: auto;
        }
    </style>
</head>

<body>
    <div class="d1"></div>
    <div class="d2">ola mundo</div>
</body>

</html>
