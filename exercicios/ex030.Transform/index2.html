<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rotate</title>
    <style>
        #rotate {
           width: 400px; 
           height: 200px;
           background: black;
           transform: rotate(-20deg);
           transform-origin: right top;
        }
        #rotate2 {
            width: 400px;
            height: 200px;
            background: blue;
        }
    </style>
</head>
<body>
    <div id="rotate"></div>
    <div id="rotate2"></div>
</body>
</html>
